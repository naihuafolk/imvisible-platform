# เสิร์ฟ frontend + proxy /api และ /health ไป backend (same-origin ไม่ต้องพึ่ง CORS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # เรียก backend ผ่าน path เดียวกัน — ในหน้า "การตั้งค่า" ให้เว้น base URL ว่างไว้
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }
    location = /health {
        proxy_pass http://api:8000/health;
    }

    # ไฟล์แอป (JS/CSS): ห้ามเบราว์เซอร์ cache ค้าง — บังคับเช็กเวอร์ชันใหม่ทุกครั้ง (304 ถ้าไม่เปลี่ยน = ถูก+เร็ว)
    # กันบั๊ก 'deploy แล้วปุ่ม/เมนูใหม่ไม่ขึ้นเพราะเบราว์เซอร์ยังใช้ JS เก่า'
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
